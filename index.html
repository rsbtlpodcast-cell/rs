<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Informasi RSUD Bedas Tegalluar</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --primary: #007c91;
  --secondary: #00bfa5;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: #f5fbfb;
  overflow: hidden;
}

header {
  height: 120px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 40px;
  background: linear-gradient(90deg, var(--primary), var(--secondary));
  color: #fff;
}

header img {
  height: 90px;
}

#clock {
  text-align: right;
}

#day {
  font-size: 34px;
  font-weight: 700;
}

#date {
  font-size: 24px;
}

#time {
  font-size: 42px;
  font-weight: 700;
  color: #ffeb3b;
}

main {
  height: calc(100vh - 170px);
  padding: 15px;
}

#slide,
#videoContainer {
  width: 100%;
  height: 100%;
}

#videoContainer {
  display: none;
  align-items: center;
  justify-content: center;
  background: #000;
}

#hospitalVideo {
  width: 100%;
  height: 100%;
  object-fit: contain;
}

.doctor-card {
  height: 100%;
  display: flex;
  background: #fff;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 10px 25px rgba(0,0,0,.15);
}

.doctor-photo {
  width: 45%;
  object-fit: contain;
  background: #fff;
}

.doctor-info {
  flex: 1;
  padding: 30px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.doctor-info h3 {
  font-size: 48px;
  margin: 0;
  color: var(--primary);
}

.doctor-info p {
  font-size: 28px;
  margin: 10px 0 25px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 26px;
  text-align: center;
}

th {
  background: var(--primary);
  color: #fff;
  padding: 15px;
}

td {
  padding: 18px;
  border: 1px solid #ddd;
}

.today {
  background: #ffeb3b;
  font-weight: 700;
}

.marquee {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: var(--primary);
  color: #fff;
  padding: 10px 0;
  overflow: hidden;
}

.marquee-content {
  white-space: nowrap;
  display: inline-block;
  font-size: 24px;
  font-weight: 600;
  animation: marquee 35s linear infinite;
}

@keyframes marquee {
  from {
    transform: translateX(100%);
  }
  to {
    transform: translateX(-100%);
  }
}

/* STYLE TAMPILAN OVERLAY INDONESIA RAYA */
#indonesiaRayaOverlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: #000;
  color: #fff;
  z-index: 9999;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
}
</style>
</head>

<body>

<header>
  <img src="img/logorsud.png" alt="Logo RSUD Bedas Tegalluar" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x90?text=Logo+RSUD';">
  <div id="clock">
    <div id="day"></div>
    <div id="date"></div>
    <div id="time"></div>
  </div>
</header>

<main>
  <div id="slide"></div>
  <div id="videoContainer">
    <video
      id="hospitalVideo"
      playsinline
      autoplay
      muted
      preload="auto"
      style="width:100%;height:100%;object-fit:contain;">
    </video>
  </div>
</main>

<!-- AUDIO DOKTER -->
<audio id="doctorMusic" loop preload="auto">
  <source src="audio/1.mp3" type="audio/mpeg">
</audio>

<!-- AUDIO INDONESIA RAYA -->
<audio id="indonesiaRayaAudio" preload="auto">
  <source src="audio/indonesia_raya1.mp3" type="audio/mpeg">
</audio>

<!-- OVERLAY KHUSUS INDONESIA RAYA -->
<div id="indonesiaRayaOverlay">
  <img src="img/logorsud.png" style="height: 120px; margin-bottom: 20px;" alt="Logo RSUD" onerror="this.onerror=null; this.src='https://via.placeholder.com/200x90?text=Logo+RSUD';">
  <h1 style="font-size: 50px; margin: 10px 0; color: #ffeb3b;">MARI MENDENGARKAN LAGU INDONESIA RAYA</h1>
  <p style="font-size: 28px; margin-top: 10px;">Hormat dan Berdiri Tegak Saat Lagu Berkumandang</p>
</div>

<div class="marquee">
  <div class="marquee-content">
    Selamat Datang di RSUD Bedas Tegalluar • Gunakan Mobile JKN untuk pendaftaran • Isi Survei Kepuasan Masyarakat melalui QR Code • Dilarang Merokok di Area Rumah Sakit
  </div>
</div>

<script>
// ==================== DATA DOKTER ====================
const doctors = [
  {
    img: "img/1.png",
    name: "dr. Mulfi Azmi, Sp.PD",
    specialist: "Spesialis Penyakit Dalam",
    jadwal: { Senin: "-", Selasa: "07:30-10:30", Rabu: "-", Kamis: "07:30-10:30", Jumat: "12:30-15:00", Sabtu: "-" }
  },
  {
    img: "img/2.png",
    name: "dr. Aditya Rifandi Zaenudin, Sp.OG",
    specialist: "Spesialis Kandungan & Kebidanan",
    jadwal: { Senin: "-", Selasa: "13:00-16:00", Rabu: "-", Kamis: "08:00-12:00", Jumat: "-", Sabtu: "10:00-13:00" }
  },
  {
    img: "img/3.png",
    name: "dr. Olga Vicetria Purba, Sp.A",
    specialist: "Spesialis Anak",
    jadwal: { Senin: "-", Selasa: "07:30-10:30", Rabu: "12:30-15:30", Kamis: "-", Jumat: "07:30-10:30", Sabtu: "-" }
  },
  {
    img: "img/5.png",
    name: "dr. R. Rezky Muhammad Nur Ismail, Sp.B",
    specialist: "Spesialis Bedah",
    jadwal: { Senin: "13:00-16:00", Selasa: "-", Rabu: "13:00-16:00", Kamis: "-", Jumat: "13:00-16:00", Sabtu: "-" }
  },
  {
    img: "img/4.png",
    name: "dr. Shiella Marlene, Sp.Rad",
    specialist: "Spesialis Radiologi",
    jadwal: { Senin: "12:00-14:00", Selasa: "-", Rabu: "12:00-14:00", Kamis: "12:00-14:00", Jumat: "-", Sabtu: "-" }
  },
  {
    img: "img/6.png",
    name: "drg. Za'im Isyraqizh Zhafari, Sp.KGA",
    specialist: "Spesialis Gigi Mulut dan Anak",
    jadwal: { Senin: "-", Selasa: "08:00-12:00", Rabu: "-", Kamis: "-", Jumat: "-", Sabtu: "08:00-12:00" }
  }
];

// ==================== PLAYLIST VIDEO ====================
const videoPlaylist = [
  "video/44.mp4",
  "video/11.mp4",
  "video/22.mp4",
  "video/33.mp4"
];

// ==================== PLAYLIST GAMBAR ALUR ====================
const promoPlaylist = [
  "img/R1.png",
  "img/R2.png",
  "img/R3.png"
];

// ==================== DURASI SLIDE ====================
const SLIDE_DURATION = 10000;

// ==================== ELEMENT REF ====================
const slideContainer = document.getElementById("slide");
const videoContainer = document.getElementById("videoContainer");
const videoElement = document.getElementById("hospitalVideo");
const doctorMusic = document.getElementById("doctorMusic");

const indonesiaRayaAudio = document.getElementById("indonesiaRayaAudio");
const indonesiaRayaOverlay = document.getElementById("indonesiaRayaOverlay");

const elDay = document.getElementById("day");
const elDate = document.getElementById("date");
const elTime = document.getElementById("time");

// ==================== INDEX TRACKER & FLAGS ====================
let currentDoctorIndex = 0;
let currentVideoIndex = 0;
let currentPromoIndex = 0;
let slideInterval;
let isAudioUnlocked = false;
let isPlayingNationalAnthem = false;

// ==================== UNLOCK AUDIO ON FIRST CLICK ====================
function unlockAudio() {
  isAudioUnlocked = true;
  videoElement.muted = false;

  if (doctorMusic && slideContainer.style.display !== "none" && !isPlayingNationalAnthem) {
    doctorMusic.play().catch(err => console.warn("Audio play error:", err));
  }

  document.removeEventListener("click", unlockAudio);
  document.removeEventListener("touchstart", unlockAudio);
}
document.addEventListener("click", unlockAudio);
document.addEventListener("touchstart", unlockAudio);

// ==================== LOGIKA INDONESIA RAYA ====================
function playIndonesiaRaya() {
  if (isPlayingNationalAnthem) return;
  isPlayingNationalAnthem = true;

  // 1. Hentikan interval dan media yang sedang berputar
  clearInterval(slideInterval);
  if (doctorMusic) doctorMusic.pause();
  videoElement.pause();

  // 2. Tampilkan Layar Indonesia Raya
  indonesiaRayaOverlay.style.display = "flex";

  // 3. Putar audio lagu Indonesia Raya
  indonesiaRayaAudio.currentTime = 0;
  indonesiaRayaAudio.play().catch(err => console.warn("Gagal memutar lagu Indonesia Raya:", err));
}

function restoreAfterAnthem() {
  // Sembunyikan Layar Indonesia Raya & kembalikan status
  indonesiaRayaOverlay.style.display = "none";
  isPlayingNationalAnthem = false;

  // Lanjutkan kembali alur tampilan normal
  showDoctorsLoop();
}

indonesiaRayaAudio.addEventListener("ended", restoreAfterAnthem);
indonesiaRayaAudio.addEventListener("error", restoreAfterAnthem);

// ==================== ALUR 1: SLIDE DOKTER ====================
function showDoctorsLoop() {
  if (isPlayingNationalAnthem) return;

  clearInterval(slideInterval);
  videoElement.pause();
  videoContainer.style.display = "none";
  slideContainer.style.display = "block";

  if (doctorMusic && isAudioUnlocked) {
    doctorMusic.currentTime = 0;
    doctorMusic.play().catch(err => console.warn("Audio play error:", err));
  }

  renderDoctorCard();

  slideInterval = setInterval(() => {
    currentDoctorIndex++;
    if (currentDoctorIndex >= doctors.length) {
      clearInterval(slideInterval);
      currentDoctorIndex = 0;
      startVideoSequence();
    } else {
      renderDoctorCard();
    }
  }, SLIDE_DURATION);
}

function renderDoctorCard() {
  const d = doctors[currentDoctorIndex];
  const days = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
  const today = days[new Date().getDay()];

  slideContainer.innerHTML = `
    <div class="doctor-card">
      <img class="doctor-photo" src="${d.img}" alt="${d.name}" onerror="this.onerror=null; this.src='https://via.placeholder.com/400x500?text=Foto+Dokter+Tidak+Ditemukan';">
      <div class="doctor-info">
        <h3>${d.name}</h3>
        <p>${d.specialist}</p>
        <table>
          <tr><th>Sen</th><th>Sel</th><th>Rab</th><th>Kam</th><th>Jum</th><th>Sab</th></tr>
          <tr>
            <td class="${today === "Senin" ? "today" : ""}">${d.jadwal.Senin}</td>
            <td class="${today === "Selasa" ? "today" : ""}">${d.jadwal.Selasa}</td>
            <td class="${today === "Rabu" ? "today" : ""}">${d.jadwal.Rabu}</td>
            <td class="${today === "Kamis" ? "today" : ""}">${d.jadwal.Kamis}</td>
            <td class="${today === "Jumat" ? "today" : ""}">${d.jadwal.Jumat}</td>
            <td class="${today === "Sabtu" ? "today" : ""}">${d.jadwal.Sabtu}</td>
          </tr>
        </table>
      </div>
    </div>
  `;
}

// ==================== ALUR 2: PLAYLIST VIDEO ====================
function startVideoSequence() {
  if (isPlayingNationalAnthem) return;

  clearInterval(slideInterval);

  if (doctorMusic) {
    doctorMusic.pause();
  }

  if (videoPlaylist.length === 0) {
    startPromoSequence();
    return;
  }

  slideContainer.style.display = "none";
  videoContainer.style.display = "flex";
  currentVideoIndex = 0;
  playVideo();
}

function playVideo() {
  if (isPlayingNationalAnthem) return;

  if (currentVideoIndex >= videoPlaylist.length) {
    startPromoSequence();
    return;
  }

  const file = videoPlaylist[currentVideoIndex];
  
  videoElement.pause();
  videoElement.src = file;
  videoElement.muted = !isAudioUnlocked;

  const playPromise = videoElement.play();

  if (playPromise !== undefined) {
    playPromise.catch((err) => {
      console.warn("Video gagal diputar, otomatis lanjut ke video berikutnya:", file, err);
      handleVideoEnded();
    });
  }
}

function handleVideoEnded() {
  if (isPlayingNationalAnthem) return;

  currentVideoIndex++;
  if (currentVideoIndex < videoPlaylist.length) {
    playVideo();
  } else {
    currentVideoIndex = 0;
    startPromoSequence();
  }
}

videoElement.addEventListener("ended", handleVideoEnded);
videoElement.addEventListener("error", handleVideoEnded);

// ==================== ALUR 3: SLIDE PROMO / GAMBAR ====================
function startPromoSequence() {
  if (isPlayingNationalAnthem) return;

  clearInterval(slideInterval);
  videoElement.pause();

  if (doctorMusic) {
    doctorMusic.pause();
  }

  videoContainer.style.display = "none";
  slideContainer.style.display = "block";

  if (promoPlaylist.length === 0) {
    showDoctorsLoop();
    return;
  }

  currentPromoIndex = 0;
  renderPromoCard();

  slideInterval = setInterval(() => {
    currentPromoIndex++;
    if (currentPromoIndex >= promoPlaylist.length) {
      clearInterval(slideInterval);
      showDoctorsLoop();
    } else {
      renderPromoCard();
    }
  }, SLIDE_DURATION);
}

function renderPromoCard() {
  slideContainer.innerHTML = `
    <div style="width:100%; height:100%; display:flex; justify-content:center; align-items:center; background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 10px 25px rgba(0,0,0,.15);">
      <img src="${promoPlaylist[currentPromoIndex]}" style="width:100%; height:100%; object-fit:contain;" alt="Informasi RSUD" onerror="this.onerror=null; this.src='https://via.placeholder.com/800x500?text=Gambar+Promo+Tidak+Ditemukan';">
    </div>
  `;
}

// ==================== JAM DAN TANGGAL ====================
function updateClock() {
  const d = new Date();
  const hari = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
  const bulan = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

  elDay.textContent = hari[d.getDay()];
  elDate.textContent = d.getDate() + " " + bulan[d.getMonth()] + " " + d.getFullYear();
  elTime.textContent = d.toLocaleTimeString("id-ID", { hour: "2-digit", minute: "2-digit", second: "2-digit" });

  // PEMICU OTOMATIS: Pukul 10:00:00 Siang
  if (d.getHours() === 10 && d.getMinutes() === 00 && d.getSeconds() === 0) {
    playIndonesiaRaya();
  }
}

// ==================== START ====================
updateClock();
setInterval(updateClock, 1000);
showDoctorsLoop();
</script>

</body>
</html>
